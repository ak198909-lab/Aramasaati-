name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Klasorleri hazirla
        run: |
          set -e
          shopt -s nullglob
          P=app/src/main
          mkdir -p $P/java/com/aramasaati/app $P/res/layout $P/res/values
          for f in *.kt; do mv "$f" $P/java/com/aramasaati/app/; done
          for f in activity_*.xml; do mv "$f" $P/res/layout/; done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml $P/; fi
          rm -f strings.xml themes.xml build.gradle.kts settings.gradle.kts gradle.properties
          rm -f app/build.gradle.kts

          # Yedeklemeyi kapat
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $P/AndroidManifest.xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AramaSaati"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aramasaati.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.aramasaati.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storeType = "pkcs12"
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "aramasaati"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VER
