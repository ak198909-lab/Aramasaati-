name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Klasorleri hazirla
        run: |
          set -e
          shopt -s nullglob
          P=app/src/main
          mkdir -p $P/java/com/aramasaati/app $P/res/layout $P/res/values
          for f in *.kt; do mv "$f" $P/java/com/aramasaati/app/; done
          for f in activity_*.xml; do mv "$f" $P/res/layout/; done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml $P/; fi
          rm -f strings.xml themes.xml build.gradle.kts settings.gradle.kts gradle.properties
          rm -f app/build.gradle.kts

          # Yedeklemeyi kapat
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $P/AndroidManifest.xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AramaSaati"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aramasaati.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.aramasaati.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storeType = "pkcs12"
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "aramasaati"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > $P/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Arama Saati</string>
              <string name="edit_title">Kural</string>
          </resources>
          EOF

          cat > $P/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AramaSaati" parent="Theme.Material3.DayNight" />
          </resources>
          EOF

      - name: Imza anahtarini yerlestir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'i eklenmemis (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.p12

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK olustur
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Anahtari sil
        if: always()
        run: rm -f app/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: AramaSaati-apk
          path: app/build/outputs/apk/release/*.apk
